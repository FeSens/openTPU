name: otpu_impl
description: 'The whole design''s implementation, no RTL: the Vivado run properties in
  boards/ypcb-00338/vivado/impl_directives.tcl (one `set_property <PROP> <value> [get_runs
  synth_1|impl_1]` per line: synthesis options such as retiming, flatten, fanout limits; opt / place /
  phys_opt / route directives; post-route phys_opt) and placement in the core constraints
  (boards/ypcb-00338/constraints/otpu_top_ld.xdc: pblocks, LOC / BEL-free placement hints, MAX_FANOUT and
  register-duplication properties; no timing exceptions or clock changes). Judged only by the full
  build: its WNS and its area.'
allowed:
- boards/ypcb-00338/vivado/impl_directives.tcl
- boards/ypcb-00338/constraints/otpu_top_ld.xdc
synth:
  parts: []
objectives:
- fmax
target_mhz: 133.33
tests:
  fast:
  - tests/test_rtl.py::test_mlp_rtl[1]
  board:
  - tests/test_rtl.py::test_design_size_block_128_rtl
perf: false
