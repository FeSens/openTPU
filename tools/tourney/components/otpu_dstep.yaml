name: otpu_dstep
description: 'DSTEP datapath (inside the DMA, u_dma/u_ds): the gated delta-rule step of Qwen3.5''s linear-attention
  layers on LANES fp32 lanes -- q/k/v/decay/beta fill, the k.S and q.S row products (otpu_fmul + otpu_fadd
  partial sums, two otpu_vtree folding trees u_ta and u_tq), the d = beta (v - e k.S) chain (three otpu_fmadd),
  the state update (otpu_fmma per lane) and the delay buffers that line them up. Results must stay bit-identical
  to the ISA''s DSTEP (docs/isa.md).'
allowed:
- rtl/dma/otpu_dstep.sv
synth:
  parts:
  - top: otpu_dstep
    weight: 1
    params:
      LANES: 8
    sources:
    - rtl/vpu/otpu_fp.sv
    - rtl/vpu/otpu_fpipe.sv
    - rtl/top/otpu_pkg.sv
    - rtl/vpu/otpu_vtree.sv
    - rtl/dma/otpu_dstep.sv
target_mhz: 110
tests:
  fast:
  - tests/test_perf.py
  - tests/test_vops.py::test_dstep_rtl_bit_exact
  - tests/test_rtl.py::test_mlp_rtl[1]
  - tests/test_rtl.py::test_design_size_block_128_rtl
  board:
  - tests/test_rtl.py::test_design_size_block_128_rtl
  - tests/test_qwen35.py::test_tiny_prefill_rows_dstep_on_rtl
  - tests/test_qwen35.py::test_tiny_qwen35_on_board_model[True-False]
perf: true
