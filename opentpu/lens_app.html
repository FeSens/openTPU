<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --ground: #f2f4f3; --panel: #ffffff; --panel2: #f6f8f7; --ink: #121917; --muted: #5b6a64;
  --faint: #8d9a95; --line: #d7dfdb; --grid: #e8edeb; --focus: #1f6fd1;
  --u0: #4f6fae; --u1: #0f8a78; --u2: #bb7f12; --u3: #7357bf; --u4: #bb4b76;
  --busy: #1d8a4c; --dram: #cf3b30; --arb: #8a47c9; --blocked: #e07a12; --dep: #c9a100;
  --idle: #b8c2be; --good: #1d8a4c; --warn: #a86a05; --bad: #c23b33; --info: #3d5a8a;
  --good-bg: #e3f3ea; --warn-bg: #fbf0dc; --bad-bg: #fbe4e2; --info-bg: #e6edf7;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0d1311; --panel: #141c19; --panel2: #19231f; --ink: #e2eae6; --muted: #94a69e;
    --faint: #6a7c74; --line: #26322d; --grid: #1d2824; --focus: #6ea8ff;
    --u0: #86a3de; --u1: #3cc6ae; --u2: #e6ae46; --u3: #aa8eeb; --u4: #e782a8;
    --busy: #47c07a; --dram: #f06a5f; --arb: #b88af0; --blocked: #f5a04a; --dep: #e0c030;
    --idle: #3c4a45; --good: #4cc27d; --warn: #e5ad4a; --bad: #f06c62; --info: #86a8e0;
    --good-bg: #13291d; --warn-bg: #2c2412; --bad-bg: #321715; --info-bg: #16213a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0d1311; --panel: #141c19; --panel2: #19231f; --ink: #e2eae6; --muted: #94a69e;
  --faint: #6a7c74; --line: #26322d; --grid: #1d2824; --focus: #6ea8ff;
  --u0: #86a3de; --u1: #3cc6ae; --u2: #e6ae46; --u3: #aa8eeb; --u4: #e782a8;
  --busy: #47c07a; --dram: #f06a5f; --arb: #b88af0; --blocked: #f5a04a; --dep: #e0c030;
  --idle: #3c4a45; --good: #4cc27d; --warn: #e5ad4a; --bad: #f06c62; --info: #86a8e0;
  --good-bg: #13291d; --warn-bg: #2c2412; --bad-bg: #321715; --info-bg: #16213a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px;
  align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; letter-spacing: .2px; margin-right: 6px; }
header .brand span { color: var(--u1); }
select, button, input[type=text], input[type=search] { font: inherit; color: var(--ink);
  background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--focus); }
button.primary { background: var(--u1); color: #fff; border-color: transparent; }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button { border: none; background: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav.tabs button.on { background: var(--panel2); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--u1); }
.spacer { flex: 1; }
main { padding: 16px; max-width: 1480px; margin: 0 auto; }
.view { display: none; }
.view.on { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.note { border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.note.good { background: var(--good-bg); } .note.warn { background: var(--warn-bg); }
.note.bad { background: var(--bad-bg); } .note.info { background: var(--info-bg); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
td.n, th.n { text-align: right; }
td.code { font-family: var(--mono); font-size: 12px; white-space: pre; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
tr.sel td { background: var(--info-bg); }
tbody tr:hover td { background: var(--panel2); cursor: pointer; }
.scroll { max-height: 70vh; overflow: auto; }
.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.stack div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.bar { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; }
.urow { display: grid; grid-template-columns: 110px 1fr 60px; gap: 10px; align-items: center; margin: 4px 0; }
#drop { display: none; border: 2px dashed var(--line); border-radius: 14px; padding: 60px 20px; text-align: center; color: var(--muted); margin-top: 40px; }
#drop.on { display: block; }
#drop.hover, body.dragging #drop { border-color: var(--u1); color: var(--ink); }
#tl-wrap { position: relative; }
#tl { width: 100%; display: block; border-radius: 8px; background: var(--panel2); }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-width: 460px; display: none; }
.tip b { font-size: 13px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
#fp-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; }
@media (max-width: 1100px) { #fp-wrap { grid-template-columns: 1fr; } }
#fp { width: 100%; height: auto; display: block; background: var(--panel2); border-radius: 8px; }
#fp .blk { stroke: var(--line); stroke-width: 1.5; rx: 8; }
#fp text { fill: var(--ink); font: 13px var(--sans); }
#fp text.small { font-size: 10.5px; fill: var(--muted); }
#fp text.lbl { font-weight: 700; }
#fp .edge { fill: none; stroke: var(--grid); stroke-width: 5; stroke-linecap: round; }
#fp .flow { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 10 12; opacity: 0; }
#fp .flow.on { opacity: 1; animation: dash .6s linear infinite; }
#fp .arrow { opacity: 0; } #fp .arrow.on { opacity: 1; }
@keyframes dash { to { stroke-dashoffset: -22; } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.controls input[type=range] { flex: 1; min-width: 200px; }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 190px; }
.side h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.side .unit { border-left: 4px solid var(--idle); padding: 3px 8px; margin: 4px 0; background: var(--panel2); border-radius: 0 6px 6px 0; }
.side .unit .st { font-size: 11px; font-weight: 700; text-transform: uppercase; }
.side .unit .w { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 700; color: #fff; }
.gapnow { font-size: 13px; margin-top: 6px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel2); }
</style>
</head>
<body>
<header>
  <div class="brand">openTPU <span>Lens</span></div>
  <select id="sel-prof" title="profile"></select>
  <select id="sel-slice" title="slice"></select>
  <nav class="tabs" id="tabs">
    <button data-v="overview" class="on">Overview</button>
    <button data-v="timeline">Timeline</button>
    <button data-v="floor">Floorplan</button>
    <button data-v="instrs">Instructions</button>
    <button data-v="source">Source</button>
  </nav>
  <div class="spacer"></div>
  <span id="fname" class="muted mono"></span>
  <button id="btn-open" class="primary">Open profile…</button>
  <input id="file" type="file" accept=".otpuprof,.json,.gz" hidden>
  <button id="btn-theme" title="theme">◐</button>
</header>
<main>
  <section id="drop"><div style="font-size:18px;font-weight:600;margin-bottom:6px">Drop an openTPU profile here</div>
    <div>.otpuprof files from <span class="mono">python -m opentpu.lens record …</span> — or use <b>Open profile…</b></div>
    <div id="drop-err" style="color:var(--bad);margin-top:10px"></div></section>

  <section class="view" id="v-overview"></section>

  <section class="view" id="v-timeline">
    <div class="card">
      <h2>Timeline <small>wheel: zoom · drag: pan · double-click: reset · click: select</small></h2>
      <div id="tl-wrap"><canvas id="tl" height="420"></canvas></div>
      <div id="tl-sel" class="muted" style="margin-top:8px"></div>
    </div>
  </section>

  <section class="view" id="v-floor">
    <div class="card">
      <div class="controls">
        <button id="fp-prev" title="previous event (←)">⏮</button>
        <button id="fp-play" class="primary" title="play / pause (space)">▶ Play</button>
        <button id="fp-next" title="next event (→)">⏭</button>
        <select id="fp-mode" title="playback mode">
          <option value="cyc">Continuous (cycles)</option>
          <option value="ins">Instruction by instruction</option>
        </select>
        <select id="fp-speed" title="speed"></select>
        <input id="fp-scrub" type="range" min="0" max="1000" value="0">
        <span class="clock" id="fp-clock"></span>
      </div>
      <div id="fp-wrap">
        <svg id="fp" viewBox="0 0 1100 640" role="img" aria-label="floorplan of the TPU"></svg>
        <div class="side" id="fp-side"></div>
      </div>
      <div class="legend" id="fp-legend"></div>
    </div>
  </section>

  <section class="view" id="v-instrs">
    <div class="card">
      <h2>Instructions <small id="ins-count"></small></h2>
      <div class="controls">
        <input id="ins-q" type="search" placeholder="filter: name, detail, source…" style="flex:1">
        <select id="ins-unit"><option value="-1">all units</option></select>
      </div>
      <div class="scroll"><table id="ins-t"></table></div>
    </div>
  </section>

  <section class="view" id="v-source">
    <div class="card">
      <h2>Source lines <small>cycles attributed to the kernel lines that issued the instructions</small></h2>
      <div class="scroll"><table id="src-t"></table></div>
    </div>
  </section>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
const EMBED = /*__DATA__*/null;
const URL0 = /*__URL__*/null;
const FORMAT = "openTPU-profile", VERSION = 1;
const UNITS = ["DMA", "MXU", "QUANT", "VPU", "COLL"];
const UCOL = i => `var(--u${i})`;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-US");
const pct = x => (100 * x).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

let DOC = null, PI = 0, SI = 0, M = null, VIEW = "overview";

// ------------------------------------------------------------------ loading
async function parseBytes(buf) {
  const u8 = new Uint8Array(buf);
  let text;
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
    text = await new Response(ds).text();
  } else text = new TextDecoder().decode(u8);
  const doc = JSON.parse(text);
  if (doc.format !== FORMAT) throw new Error("not an openTPU profile file");
  if ((doc.version | 0) > VERSION) throw new Error(`profile version ${doc.version} is newer than this Lens`);
  return doc;
}
function setDoc(doc, name) {
  DOC = doc; PI = 0; SI = 0;
  $("fname").textContent = name || "";
  $("drop").classList.remove("on");
  const sp = $("sel-prof");
  sp.innerHTML = doc.profiles.map((p, i) => `<option value="${i}">[${p.kind}] ${esc(p.name)}</option>`).join("");
  selectProfile(0);
}
async function openFile(f) {
  try { setDoc(await parseBytes(await f.arrayBuffer()), f.name); $("drop-err").textContent = ""; }
  catch (e) { $("drop").classList.add("on"); $("drop-err").textContent = "Could not open " + f.name + ": " + e.message; }
}
$("btn-open").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && openFile(e.target.files[0]);
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
document.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("dragging");
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
$("btn-theme").onclick = () => {
  const r = document.documentElement, cur = r.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("lens-theme", r.dataset.theme); } catch (e) {}
  redraw();
};
try { const t = localStorage.getItem("lens-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ------------------------------------------------------------------ model of one profile + slice
function build(p, s) {
  const cfg = p.config, units = p.units || UNITS;
  const ins = p.instrs.filter(r => r[0] === s).map((r, i) => ({
    i, idx: r[1], pc: r[2], unit: r[3], name: r[4], detail: r[5], disp: r[6], ready: r[7],
    rel: r[8], start: r[9], end: r[10], src: r[11], stats: r[12] || {}, work: r[13] | 0,
    pb: r[14] | 0, pa: r[15] | 0 }));
  const sl = p.slices[s] || {buckets: {}};
  const B = sl.buckets || {};
  const nb = (B.c || []).length;
  const bn = B.n || [];
  const bstart = new Float64Array(nb), bend = new Float64Array(nb);
  for (let k = 0; k < nb; k++) { bend[k] = B.c[k] + 1; bstart[k] = bend[k] - bn[k]; }
  const get = (key, k) => (B[key] ? B[key][k] : 0) | 0;
  // unit coverage per bucket (union of in-flight intervals)
  const cov = units.map(() => new Float64Array(nb));
  if (nb) {
    for (let u = 0; u < units.length; u++) {
      // an MM streams from its start but computes only once released (its operands ready)
      const iv = ins.filter(r => r.unit === u && r.start >= 0 && r.end > r.start)
        .map(r => [u === 1 && r.rel > r.start ? Math.min(r.rel, r.end) : r.start, r.end]).sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const [a, b] of iv) { const L = merged[merged.length - 1]; if (L && a <= L[1]) L[1] = Math.max(L[1], b); else merged.push([a, b]); }
      let k = 0;
      for (const [a, b] of merged) {
        while (k < nb && bend[k] <= a) k++;
        for (let j = k; j < nb && bstart[j] < b; j++) cov[u][j] += Math.max(0, Math.min(b, bend[j]) - Math.max(a, bstart[j]));
      }
    }
  }
  const events = [...new Set(ins.flatMap(r => [r.start, r.end, r.disp]).filter(x => x >= 0))].sort((a, b) => a - b);
  const starts = ins.filter(r => r.start >= 0).map(r => r.start).sort((a, b) => a - b);
  const byStart = ins.slice().sort((a, b) => a.start - b.start);
  return { p, s, cfg, units, ins, B, nb, bstart, bend, bn, get, cov, events, starts, byStart,
           cycles: p.cycles || 1, fifo: 128 };
}

// gap causes: why DRAM port B was idle
const CAUSES = [
  ["busy", "DRAM port B streaming", "--u1"],
  ["dram", "DRAM not ready (backpressure)", "--dram"],
  ["starve", "MXU starved: chunk FIFO empty (latency)", "--blocked"],
  ["blocked", "MXU not consuming (drain / row credits)", "--dep"],
  ["arb", "TMEM bank arbitration", "--arb"],
  ["mxu", "MXU computing, not streaming (row turnarounds, epilogue)", "--u1"],
  ["w3", "waiting on VPU work", "--u3"],
  ["w2", "waiting on quantizer work", "--u2"],
  ["w4", "waiting on collectives", "--u4"],
  ["w0", "waiting on DMA work", "--u0"],
  ["none", "nothing in flight (dispatch / program order)", "--idle"],
];
function bucketCauses(m, k) {
  const g = x => m.get(x, k), n = m.bn[k] || 0;
  const out = {};
  const busy = Math.min(n, g("bm") + g("bd"));
  out.busy = busy;
  let r = n - busy;
  const take = (key, v) => { const t = Math.max(0, Math.min(r, v)); out[key] = (out[key] || 0) + t; r -= t; };
  take("dram", g("bs"));
  take("starve", g("ms"));
  take("blocked", g("mb"));
  take("arb", g("fm"));
  if (r > 0) take("mxu", m.cov[1][k] - busy);
  if (r > 0) {
    const others = [3, 2, 4, 0].map(u => [u, m.cov[u][k]]).filter(x => x[1] > 0);
    const tot = others.reduce((a, x) => a + x[1], 0);
    if (tot > 0) { const rr = r; for (const [u, c] of others) take("w" + u, rr * c / tot); }
  }
  if (r > 0) take("none", r);
  return out;
}
function allCauses(m, k1 = m.nb) {
  const tot = {};
  for (let k = 0; k < k1; k++) { const c = bucketCauses(m, k); for (const key in c) tot[key] = (tot[key] || 0) + c[key]; }
  return tot;
}
function stackBar(tot, total) {
  let h = "", leg = "";
  for (const [key, label, col] of CAUSES) {
    const v = tot[key] || 0;
    if (v <= 0) continue;
    h += `<div title="${esc(label)}: ${fmt(Math.round(v))} cycles (${pct(v / total)})" style="width:${100 * v / total}%;background:var(${col})${key === "mxu" ? ";opacity:.45" : ""}"></div>`;
    leg += `<span><i style="background:var(${col})${key === "mxu" ? ";opacity:.45" : ""}"></i>${esc(label)} <b>${pct(v / total)}</b></span>`;
  }
  return `<div class="stack">${h}</div><div class="legend">${leg}</div>`;
}

// ------------------------------------------------------------------ selection
function selectProfile(i) {
  PI = i; const p = DOC.profiles[i];
  $("sel-prof").value = i;
  const S = p.config.S || 1;
  $("sel-slice").innerHTML = Array.from({length: S}, (_, s) => `<option value="${s}">slice ${s}</option>`).join("");
  $("sel-slice").style.display = S > 1 ? "" : "none";
  selectSlice(0);
}
function selectSlice(s) {
  SI = s; $("sel-slice").value = s;
  M = build(DOC.profiles[PI], s);
  TL.t0 = 0; TL.t1 = M.cycles; TL.sel = null; FP.t = 0; FP.playing = false; FP.built = false;
  renderOverview(); renderInstrs(); renderSource();
  if (VIEW === "timeline") drawTimeline();
  if (VIEW === "floor") { buildFloor(); updateFloor(); }
}
$("sel-prof").onchange = e => selectProfile(+e.target.value);
$("sel-slice").onchange = e => selectSlice(+e.target.value);
function show(v) {
  VIEW = v;
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.v === v);
  for (const sec of document.querySelectorAll(".view")) sec.classList.toggle("on", sec.id === "v-" + v);
  if (!M) return;
  if (v === "timeline") drawTimeline();
  if (v === "floor") { if (!FP.built) buildFloor(); updateFloor(); }
}
for (const b of $("tabs").children) b.onclick = () => show(b.dataset.v);
function redraw() { if (!M) return; if (VIEW === "timeline") drawTimeline(); if (VIEW === "floor") { FP.built = false; buildFloor(); updateFloor(); } }

// ------------------------------------------------------------------ overview
function renderOverview() {
  const p = M.p, m = M, cyc = m.cycles, cfg = p.config, rl = p.roofline;
  const us = cyc / (p.clock_mhz || 100);
  const sl = p.slices[m.s] || {};
  const ports = sl.ports || {};
  const portB = ((ports.bmxu || 0) + (ports.bdma || 0)) / cyc;
  let h = `<div class="card"><h2>${esc(p.name)} <small>${esc(p.kind)} · S=${cfg.S} D=${cfg.D} MCOLS=${cfg.MCOLS} LANES=${cfg.LANES}${cfg.WIN ? " WIN=" + cfg.WIN : ""}${cfg.WPB ? " WPB=" + cfg.WPB : ""}</small></h2>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(cyc)}</div><div class="l">cycles${p.kind === "isa" ? " (analytic, serial)" : ""}</div></div>
    <div class="kpi"><div class="v">${us >= 1000 ? (us / 1000).toFixed(2) + " ms" : us.toFixed(1) + " µs"}</div><div class="l">at ${p.clock_mhz || 100} MHz</div></div>

    + `<span style="margin-left:12px">moving dashes = data moving on that path · <kbd>space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> step</span>`;

}
function bucketAt(t) { return M.nb ? Math.min(M.nb - 1, lowerBound(M.bend, t + 1)) : -1; }

function updateFloor() {

    b.r.setAttribute("fill", st === "idle" ? css("--panel") : css("--panel2"));

  FP.el.clanes.forEach(segs => segs.forEach(s => s.setAttribute("fill", vop ? vcol : css("--grid"))));
  FP.el.slanes.forEach(s => s.setAttribute("fill", vop && !comp ? vcol : css("--grid")));
  // DRAM meters
  const pb = fr("bm") + fr("bd");

  FP.el.boxes.axi.st.textContent = k >= 0 ? `B ${pct(Math.min(1, pb))} · A ${pct(Math.min(1, fr("am") + fr("aq")))}` : "";

  // clock + scrub

  h += `<h3>Units</h3>`;

      + (s.r ? `<div class="w">${esc(s.r.name)} ${esc(s.r.detail)}</div><div class="w mono">${esc(srcText(s.r.src))}</div>` : s.pend.length ? `<div class="w">next: ${esc(s.pend[0].name)} ${esc(s.pend[0].detail)}${s.st === "dep" ? " (dependencies not done)" : ""}</div>` : "") + `</div>`;

function setT(t) { FP.t = Math.max(0, Math.min(M.cycles, t)); updateFloor(); }

function stepStart(dir) {

const SPEEDS = { cyc: [[100, "100 cyc/s"], [1000, "1k cyc/s"], [10000, "10k cyc/s"], [100000, "100k cyc/s"], [1000000, "1M cyc/s"], [10000000, "10M cyc/s"]],
                 ins: [[1, "1 instr/s"], [2, "2 instr/s"], [5, "5 instr/s"], [10, "10 instr/s"], [30, "30 instr/s"], [100, "100 instr/s"]] };

fillSpeeds();
$("fp-mode").onchange = fillSpeeds;
function tick(now) {

    + rs.slice(0, 3000).map(r => `<tr data-i="${r.i}"><td class=n>${r.idx}</td><td class=n>${r.pc}</td><td>${M.units[r.unit]}</td><td>${esc(r.name)}</td><td>${esc(r.detail)}</td><td class=n>${fmt(r.start)}</td><td class=n>${fmt(r.end - r.start)}</td><td class=n>${fmt(Math.max(0, r.ready - r.disp))}</td><td class=n>${fmt(Math.max(0, r.start - r.ready))}</td><td class=n>${fmt(r.work)}</td><td class=n>${fmt(r.pb)}</td><td class="code">${esc(srcText(r.src))}</td></tr>`).join("") + "</tbody>";
