# DKMS package for otpu_pcie (this directory), as installed by opentpu/host/setup_pcie.sh, which
# fills in PACKAGE_VERSION.
PACKAGE_NAME="otpu-pcie"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="otpu_pcie"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
AUTOINSTALL="yes"
