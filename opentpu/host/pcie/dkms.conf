# DKMS package for the Xilinx XDMA driver as built by opentpu/host/setup_pcie.sh (the source
# tree next to this file is dma_ip_drivers XDMA/linux-kernel/{xdma,include} with
# xdma-otpu.patch applied). setup_pcie.sh fills in PACKAGE_VERSION.
PACKAGE_NAME="otpu-xdma"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="xdma"
BUILT_MODULE_LOCATION[0]="xdma/"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/xdma modules"
AUTOINSTALL="yes"
