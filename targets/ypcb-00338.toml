# The Inspur YPCB-00338 card: Xilinx Kintex-7 xc7k480t, two DDR3 channels, PCIe Gen2 x8.
# The production build (docs/board.md). Every value here is what `make -C boards/ypcb-00338 bit`
# builds by default; opentpu/target.py derives the RTL parameters, the Vivado generics, the
# simulators' configuration and the host's expectations from it.

[target]
name = "ypcb-00338"
kind = "fpga"
platform_id = 1                 # the CFG_PLATFORM register
description = "Inspur YPCB-00338: xc7k480t, 2 x DDR3-1066 (LiteDRAM), XDMA Gen2 x8"
variant = "m4"                  # the default build's [variants.<name>] (below): ypcb-00338:m8 the other

[arch]                          # opentpu.isasim.Config: what programs depend on
S = 1
D = 128
MCOLS = 4                       # release r2 (m4): 4 MX columns, production 8b33206e's (m8: 8, r2.1)
ACT_BLOCKS = 128
ACT_ROWS = 16                   # the MX build's: MMs of up to 16 rows (replay); 0: MCOLS
TMEM_WORDS = 65536              # m4: 64K (64 RAMB36 at TMEM_IMPL 3). m8: 128K, at MCOLS 8 and 64K
#                                 Qwen3.5-0.8B's MTP prompt runs held 5-7 rows and Gemma 4 E2B's 4-6
#                                 (next-fit and best-fit alike); 128K runs 8: every row short of
#                                 MCOLS is another pass of the weights
IMEM_WORDS = 32768
DRAM_BYTES = 4294967296         # per slice
LANES = 8
PAIR = true
DUAL = false                    # port B chunk pairs (int8 MM PAIR, otpu_native_dram2)
QUAD = false                    # (DUAL) 4-bit MM PAIR four blocks (two chunks) an advance
DAW = 32                        # DRAM address width per slice, 32..36 (docs/wide_dram_hbm.md)
DSTEP = true
STREAM = true
SEQ_WC = true                   # the sequencer's wait entries (WAITC v2, docs/seq_vpu.md; release r2):
#                                 the host loads them with every program; needs WIN <= 16

[uarch]                         # timing only: RTL parameters the programs do not see
MXU_IMPL = 2                    # systolic (docs/mxu_systolic.md)
MXU_CL = 16
MXU_E = 4                       # epilogue lanes: MCOLS, full rate (docs/mx_mxu.md 9: E = MCOLS at
                                # MCOLS 8; E 4 halves prefill q.K^T at d 128 and G 5-8 decode)
VPU_CL = 2
ULANES = 8
TMEM_IMPL = 3                   # 0: one copy per read port (block RAM); 1: banked 1R1W macros;
                                # 3: one copy (docs/tmem_nocopy.md), the pick r2pgRs below:
TMEM_NSB = 2                    #   2 RAMs a bank (64 RAMB36 at 64K words, 128 at 128K; against 384),
TMEM_RPL = true                 #   lost reads replayed under the board's arbiter,
TMEM_TDP = true                 #   true dual-port RAMs,
TMEM_GST = true                 #   QUANT 3 and COLL the DMA's guests,
TMEM_PMP = 1                    #   pumped at 2x on core_clk2x (CLK2X: core_clk's divider even);
                                #   SBP 3, SBH 0, PRK 0 and SDM -1 (sides s) the RTL's defaults
                                #   (vivado/tmem_knobs.tcl builds the same pick)
RPB = 0                         # TMEM reads per bank per cycle; 0: every read lane (replicated)
WPB = 1
WIN = 16
FIFO_DEPTH = 1024
TRACE_DEPTH = 16384
PQ_WIN = 1024
CHASH = true                    # hashed channel interleave (otpu_native_dram)

[tech]
family = "xilinx7"              # rtl/tech/xilinx7: DSP48E1 cells
part = "xc7k480tffg1156-2"
vendor = "xilinx"

[platform]
board = "ypcb-00338"
core_mhz = 133.33
mem = "ddr3"
mem_mts = 1066
mem_ctrl = "litedram"
hostcal = true                  # the host calibrates the controllers (CAPS bit27)
channels_per_slice = 2
channel_bytes = 2147483648
beat_bytes = 64
host = "pcie"
pcie_gen = 2
pcie_lanes = 8

# Variants (opentpu/target.py: TARGET / OTPU_TARGET = ypcb-00338:<name>): arch and uarch values
# over the ones above, each variant its own CFG_HASH. The [arch] and [uarch] above state the default
# variant's (m4: release r2's production candidate, 133.33 MHz; m8 does not close it yet: r2.1).
[variants.m8]                   # release r2.1: 8 MX columns at E 8, 128K TMEM words (CFG_HASH 46b96e6d)
MCOLS = 8
MXU_E = 8
TMEM_WORDS = 131072

[variants.m4]                   # release r2: MX production 8b33206e's MXU (4 columns, E 4) with the
MCOLS = 4                       # rest of r2, 64K TMEM words (CFG_HASH 4ffd1e17)
MXU_E = 4
TMEM_WORDS = 65536
