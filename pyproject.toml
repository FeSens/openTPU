[project]
name = "opentpu"
version = "0.1.0"
description = "openTPU: thin LLM inference accelerator -- SystemVerilog RTL, ISA simulator, Triton-style language and compiler"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
lens = "opentpu.lens:main"
otpu-lens = "opentpu.host.hwlens:main"
otpu-smi = "opentpu.host.smi:main"
otpu-selftest = "opentpu.host.selftest:main"
otpu-chat = "opentpu.host.chat:main"

[tool.setuptools.packages.find]
include = ["opentpu*", "host*"]

[tool.setuptools.package-data]
opentpu = ["lens_app.html"]
host = ["setup_pcie.sh"]
